<!DOCTYPE html>
<html>

<head>
  <meta charset='utf-8'>
  <meta http-equiv='X-UA-Compatible' content='IE=edge'>
  <title>Water Flooding experiments</title>
  <meta name='viewport' content='width=device-width, initial-scale=1'>
  <style>
    body {
      font-family: Arial, Helvetica, sans-serif;
      font-size: 13px;
      margin: 0;
      padding: 1rem;
    }

    h1 {
      font-size: 2rem;
      text-align: center;
      margin-top: 0;
    }

    table.dataframe {
      border-collapse: collapse;
      width: 100%;

      th,
      td {
        border: 1px solid #000;
        padding: 0.5rem;
        text-align: center;
      }

      th {
        background-color: #d9e0f1;
      }

      td:nth-child(n+10):empty {
        background-color: #f4af84;
      }
    }
  </style>
</head>

<body>
  <div>
    <h1>Training Experiments</h1>
    {{TABLE}}
  </div>
  <script>
    document.querySelectorAll("tr").forEach((tr, idx) => {
      tr.querySelectorAll("td").forEach((td, idx) => {
        //if (idx < 10) return;
        if (td.textContent.trim() === "FINISHED") {
          td.style.backgroundColor = "#ccffcc";
        }
        if (td.textContent.trim() === "FAILED") {
          td.style.backgroundColor = "red";
        }
        if (td.textContent.trim() === "RUNNING") {
          td.style.backgroundColor = "yellow";
        }
      })
    });
  </script>
</body>

</html>
